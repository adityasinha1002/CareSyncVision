<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="g" x1="250" y1="100" x2="250" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0a0000"/>
      <stop offset="55%"  stop-color="#3d0505"/>
      <stop offset="100%" stop-color="#9f1211"/>
    </linearGradient>
  </defs>
  <!--
    Wireframe geometric crown — stroke only, no fill.
    Key vertices:
      TOP  = (250, 100)  — top apex
      LJ   = (178, 238)  — left inner junction
      RJ   = (322, 238)  — right inner junction
      LW   = ( 82, 263)  — left wing tip
      RW   = (418, 263)  — right wing tip
      LB   = (122, 342)  — bottom-left corner
      RB   = (378, 342)  — bottom-right corner
      BC   = (250, 368)  — bottom center point
  -->
  <g stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer crown perimeter -->
    <polyline points="250,100 178,238 82,263 122,342 250,368 378,342 418,263 322,238 250,100"/>
    <!-- Horizontal crossbar connecting inner junctions -->
    <line x1="178" y1="238" x2="322" y2="238"/>
    <!-- Inner diagonals: junctions → bottom center -->
    <line x1="178" y1="238" x2="250" y2="368"/>
    <line x1="322" y1="238" x2="250" y2="368"/>
    <!-- Wing-tip rays → bottom center -->
    <line x1=" 82" y1="263" x2="250" y2="368"/>
    <line x1="418" y1="263" x2="250" y2="368"/>
  </g>
</svg>
