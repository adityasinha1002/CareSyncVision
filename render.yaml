services:
  - type: web
    name: caresynvision-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn --preload-app -w 2 -b 0.0.0.0:10000 wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_SECRET_KEY
        value: ${FLASK_SECRET_KEY}
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: RISK_LOW_THRESHOLD
        value: "30"
      - key: RISK_HIGH_THRESHOLD
        value: "60"
      - key: SESSION_TIMEOUT
        value: "3600"
      - key: PHASE_1_VERIFICATION_ONLY
        value: "True"
      - key: PHASE_2_MEDICATION_ENGINE_ENABLED
        value: "False"
      - key: PHASE_3_RESPONSE_ENGINE_ENABLED
        value: "False"
      - key: LOG_LEVEL
        value: INFO